name: Feature request
description: Suggest an improvement to the launchpad, contracts, or docs.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Great. Note that Hyde's core anti-rug guarantees are
        deliberate constraints — changes that add runtime fee setters, an
        LP-withdraw path, mint/burn/pause, a blacklist, or new owner powers need
        a separate threat-model decision (see [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md)).
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what's missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Include UX or API sketches if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you set them aside.
  - type: checkboxes
    id: guarantees
    attributes:
      label: Guarantee check
      options:
        - label: This request does NOT weaken an anti-rug / immutability guarantee (or I've explained why the trade-off is worth a threat-model review).
